<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Exitoso! - XTech Gaming Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505;
            color: whitesmoke;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
        }

        .success-card {
            background: linear-gradient(135deg, #0d0d0d 0%, #111 100%);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 16px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.1);
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to   { opacity: 1; transform: scale(1); }
        }

        .checkmark {
            font-size: 72px;
            margin-bottom: 20px;
            animation: bounceCheck 1s ease infinite alternate;
        }

        @keyframes bounceCheck {
            from { transform: scale(1); }
            to   { transform: scale(1.1); }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .session-id {
            font-size: 11px;
            color: #555;
            word-break: break-all;
            margin-top: 20px;
            background: #080808;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: #00ff66;
            color: #000;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 6px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: #00cc55;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 30px;
            color: whitesmoke;
        }

        .logo span { color: #00ff66; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="logo"><span>X</span>Tech ⚡</div>
        <div class="checkmark">✅</div>
        <h1>¡Pago Completado!</h1>
        <p>Tu pedido ha sido procesado exitosamente. Recibirás una confirmación a tu correo electrónico en breve.</p>
        <p>Nos pondremos en contacto contigo para coordinar la entrega lo antes posible. ¡Gracias por tu compra!</p>
        <div class="session-id" id="session-display"></div>
        <a href="/Index.html" class="btn-back">🏠 Volver a la Tienda</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session_id');
        if (sessionId) {
            document.getElementById('session-display').textContent = '🔑 Ref: ' + sessionId;
        }
    </script>
</body>
</html>
