<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTech Admin — Panel de Pedidos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #e60023;
            --accent-rgb: 230, 0, 35;
            --bg: #050505;
            --surface: #0d0d0d;
            --surface2: #111;
            --border: rgba(255,255,255,0.07);
            --text: whitesmoke;
            --text-muted: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        /* ── LOGIN ───────────────────────────── */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid rgba(var(--accent-rgb), 0.25);
            border-radius: 16px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(var(--accent-rgb), 0.08);
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .login-logo span { color: var(--accent); }

        .login-badge {
            display: inline-block;
            background: rgba(var(--accent-rgb), 0.1);
            border: 1px solid rgba(var(--accent-rgb), 0.3);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 3px 12px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .login-card h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .login-input {
            width: 100%;
            background: #080808;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        .login-input:focus { border-color: var(--accent); }

        .login-btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.4);
        }

        .login-error {
            color: var(--accent);
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        /* ── DASHBOARD ───────────────────────── */
        #dashboard { display: none; }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 30px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 800;
        }

        .topbar-logo span { color: var(--accent); }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-badge {
            background: rgba(var(--accent-rgb), 0.1);
            border: 1px solid rgba(var(--accent-rgb), 0.3);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 3px 10px;
            border-radius: 4px;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
        }

        .btn-logout:hover { border-color: var(--accent); color: var(--accent); }

        .main-content {
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* ── STATS ───────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 700px) {
            .stats-grid { grid-template-columns: 1fr; }
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: border-color 0.3s;
        }

        .stat-card:hover { border-color: rgba(var(--accent-rgb), 0.3); }

        .stat-icon {
            font-size: 32px;
            width: 56px;
            height: 56px;
            background: rgba(var(--accent-rgb), 0.08);
            border: 1px solid rgba(var(--accent-rgb), 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-info { display: flex; flex-direction: column; gap: 3px; }

        .stat-value {
            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-label { font-size: 12px; color: var(--text-muted); }

        /* ── TABLA DE PEDIDOS ─────────────────── */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-refresh {
            background: transparent;
            border: 1px solid rgba(var(--accent-rgb), 0.4);
            color: var(--accent);
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
        }

        .btn-refresh:hover { background: rgba(var(--accent-rgb), 0.1); }

        .orders-table-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: #0a0a0a;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background-color 0.2s;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background-color: rgba(255,255,255,0.02); }

        td {
            padding: 16px 18px;
            font-size: 13px;
            vertical-align: top;
        }

        .td-id { font-size: 11px; color: var(--text-muted); font-family: monospace; }
        .td-name { font-weight: 600; }
        .td-email { font-size: 12px; color: var(--text-muted); }
        .td-phone { font-size: 12px; color: var(--text-muted); }
        .td-items { font-size: 12px; color: #aaa; line-height: 1.6; }
        .td-total { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--accent); font-size: 15px; }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-paid {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: #00ff66;
        }

        .status-pending {
            background: rgba(255, 170, 0, 0.1);
            border: 1px solid rgba(255, 170, 0, 0.3);
            color: #ffaa00;
        }

        .td-date { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon { font-size: 48px; margin-bottom: 15px; }
        .empty-state h3 { font-size: 16px; margin-bottom: 8px; }
        .empty-state p { font-size: 13px; }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .loading-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin: 0 3px;
            animation: loadingBounce 1s infinite ease-in-out;
        }

        .loading-dot:nth-child(2) { animation-delay: 0.15s; }
        .loading-dot:nth-child(3) { animation-delay: 0.30s; }

        @keyframes loadingBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .error-msg {
            text-align: center;
            padding: 30px;
            color: var(--accent);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- ══════════ LOGIN ══════════ -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo"><span>X</span>Tech ⚡</div>
            <div class="login-badge">Admin Panel</div>
            <h2>Acceso Administrativo</h2>
            <p>Ingresa la contraseña de administrador para ver los pedidos de la tienda.</p>
            <input type="password" id="admin-password" class="login-input" placeholder="Contraseña de administrador" />
            <button class="login-btn" id="btn-login">Entrar al Panel</button>
            <p class="login-error" id="login-error">⚠️ Contraseña incorrecta. Intenta de nuevo.</p>
        </div>
    </div>

    <!-- ══════════ DASHBOARD ══════════ -->
    <div id="dashboard">
        <header class="topbar">
            <div class="topbar-logo"><span>X</span>Tech ⚡</div>
            <div class="topbar-right">
                <span class="admin-badge">ADMIN</span>
                <button class="btn-logout" id="btn-logout">Cerrar Sesión</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📦</div>
                    <div class="stat-info">
                        <span class="stat-value" id="stat-orders">—</span>
                        <span class="stat-label">Pedidos Totales</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💵</div>
                    <div class="stat-info">
                        <span class="stat-value" id="stat-revenue">—</span>
                        <span class="stat-label">Ingresos Totales</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-info">
                        <span class="stat-value" id="stat-recent">—</span>
                        <span class="stat-label">Pedidos Esta Semana</span>
                    </div>
                </div>
            </div>

            <!-- Tabla de Pedidos -->
            <div class="section-header">
                <h2>📋 Historial de Pedidos</h2>
                <button class="btn-refresh" id="btn-refresh">⟳ Actualizar</button>
            </div>

            <div class="orders-table-wrapper">
                <div id="orders-container">
                    <div class="loading">
                        <span class="loading-dot"></span>
                        <span class="loading-dot"></span>
                        <span class="loading-dot"></span>
                        <p style="margin-top:10px;">Cargando pedidos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adminPassword = '';

        // ── LOGIN ──────────────────────────────────
        document.getElementById('btn-login').addEventListener('click', async () => {
            const pw = document.getElementById('admin-password').value.trim();
            if (!pw) return;

            try {
                const res = await fetch('/api/stats', {
                    headers: { 'x-admin-password': pw }
                });
                if (!res.ok) throw new Error('Unauthorized');

                adminPassword = pw;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadDashboard();
            } catch {
                document.getElementById('login-error').style.display = 'block';
            }
        });

        document.getElementById('admin-password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btn-login').click();
        });

        // ── LOGOUT ──────────────────────────────────
        document.getElementById('btn-logout').addEventListener('click', () => {
            adminPassword = '';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('admin-password').value = '';
            document.getElementById('login-error').style.display = 'none';
        });

        // ── REFRESH ──────────────────────────────────
        document.getElementById('btn-refresh').addEventListener('click', loadDashboard);

        // ── CARGAR DATOS ──────────────────────────────
        async function loadDashboard() {
            loadStats();
            loadOrders();
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/stats', {
                    headers: { 'x-admin-password': adminPassword }
                });
                const data = await res.json();
                document.getElementById('stat-orders').textContent = data.totalOrders;
                document.getElementById('stat-revenue').textContent = '$' + data.totalRevenue;
                document.getElementById('stat-recent').textContent = data.recentOrders;
            } catch {
                // silencioso
            }
        }

        async function loadOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = `<div class="loading">
                <span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>
                <p style="margin-top:10px;">Cargando pedidos...</p>
            </div>`;

            try {
                const res = await fetch('/api/orders', {
                    headers: { 'x-admin-password': adminPassword }
                });

                if (!res.ok) {
                    container.innerHTML = '<div class="error-msg">⚠️ Error al cargar los pedidos. Contraseña inválida.</div>';
                    return;
                }

                const orders = await res.json();

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🛒</div>
                            <h3>Sin pedidos todavía</h3>
                            <p>Los pedidos con tarjeta de crédito aparecerán aquí cuando se procesen.</p>
                        </div>`;
                    return;
                }

                const rows = orders.map(o => {
                    const items = Array.isArray(o.items) ? o.items.join('<br>') : o.items;
                    const date = new Date(o.created_at).toLocaleString('es-DO');
                    const statusClass = o.status === 'paid' ? 'status-paid' : 'status-pending';
                    const statusLabel = o.status === 'paid' ? '✅ Pagado' : '⏳ Pendiente';

                    return `
                        <tr>
                            <td class="td-id">${o.stripe_id || '#' + o.id}</td>
                            <td>
                                <div class="td-name">${escapeHtml(o.customer_name)}</div>
                                <div class="td-email">${escapeHtml(o.customer_email)}</div>
                                <div class="td-phone">${escapeHtml(o.customer_phone)}</div>
                            </td>
                            <td style="font-size:12px; color:#aaa; max-width:200px;">${escapeHtml(o.shipping_address)}</td>
                            <td class="td-items">${items}</td>
                            <td class="td-total">$${parseFloat(o.total).toFixed(2)}</td>
                            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                            <td class="td-date">${date}</td>
                        </tr>
                    `;
                }).join('');

                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID / Referencia</th>
                                <th>Cliente</th>
                                <th>Dirección de Envío</th>
                                <th>Productos</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                `;
            } catch (err) {
                container.innerHTML = '<div class="error-msg">❌ Error de conexión. ¿Está el servidor corriendo?</div>';
            }
        }

        function escapeHtml(str) {
            if (!str) return '—';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
